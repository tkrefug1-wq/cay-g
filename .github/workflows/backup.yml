name: Database backup
on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" -v "$PWD:/backup" postgres:17 pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/cay-g.dump
      - uses: actions/upload-artifact@v4
        with:
          name: cay-g-${{ github.run_id }}
          path: cay-g.dump
          retention-days: 7
